<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Anime Runner</title>

    <link rel="stylesheet" href="game.css">

</head>


<body>

<div id="game">


    <!-- =====================================================
         INTRO
    ====================================================== -->

    <section
        id="introScreen"
        class="screen active"
    >

        <div class="intro-glow"></div>

        <div class="intro-content">

            <p class="small-text">
                A NEW JOURNEY BEGINS
            </p>

            <h1>
                UNKNOWN
            </h1>

            <p class="intro-description">
                Every journey begins with a single step.
            </p>

            <button id="startIntroButton">
                ENTER GAME 1
            </button>

        </div>

    </section>



    <!-- =====================================================
         LOBBY
    ====================================================== -->

    <section
        id="lobbyScreen"
        class="screen"
    >

        <div class="lobby-background"></div>

        <div class="lobby-content">

            <p class="small-text">
                ANIME RUNNER
            </p>

            <h1>
                READY?
            </h1>

            <p class="intro-description">
                Your journey is about to begin.
            </p>

            <button id="continueButton">
                CONTINUE
            </button>

        </div>

    </section>



    <!-- =====================================================
         GAME
    ====================================================== -->

    <section
        id="gameScreen"
        class="screen"
    >

        <canvas id="gameCanvas"></canvas>


        <div id="gameUI">

            <div class="game-top">

                <div class="player-display">
                    ANIME RUNNER
                </div>

                <div class="score-display">

                    SCORE

                    <span id="score">
                        0
                    </span>

                </div>

            </div>

        </div>

    </section>



    <!-- =====================================================
         GAME OVER
    ====================================================== -->

    <section
        id="surpriseScreen"
        class="screen"
    >

        <img
            id="surpriseImage"
            src="assets/surprise.png"
            alt="Surprise"
        >


        <div id="resultPanel">

            <p class="small-text">
                JOURNEY COMPLETE
            </p>


            <h1 id="resultTitle">
                YOUR SCORE
            </h1>


            <div id="resultScore">
                0
            </div>


            <p id="resultHighScore">
                SCORE: 0
            </p>


            <p
                id="newRecordText"
                class="new-record-text"
            >
                TRY AGAIN
            </p>


            <button id="retryButton">
                RETRY
            </button>


            <a
                href="../index.html"
                id="homeButton"
            >
                GO BACK TO HOME
            </a>

        </div>

    </section>


</div>


<script src="game.js"></script>

</body>

</html>
