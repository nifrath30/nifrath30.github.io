<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Anime Runner</title>

    <!-- Same fonts/style theme -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Orbitron:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="game.css">
</head>

<body>

    <!-- =====================================================
         INTRO SCREEN
         ===================================================== -->

    <section
        id="introScreen"
        class="screen active"
    >

        <div class="intro-content">

            <h1 class="game-title">
                ANIME RUNNER
            </h1>

            <p class="game-subtitle">
                WATASHI NO ANIME SOCIETY
            </p>

            <button
                id="startIntroButton"
                class="game-button"
                type="button"
            >
                ENTER GAME 1
            </button>

        </div>

    </section>


    <!-- =====================================================
         LOBBY SCREEN
         ===================================================== -->

    <section
        id="lobbyScreen"
        class="screen"
    >

        <div class="lobby-content">

            <p class="lobby-label">
                WATASHI NO ANIME SOCIETY
            </p>

            <h1 class="lobby-title">
                ANIME RUNNER
            </h1>

            <p class="lobby-description">
                RUN. JUMP. SURVIVE.
            </p>

            <button
                id="playButton"
                class="game-button"
                type="button"
            >
                CONTINUE
            </button>

        </div>

    </section>


    <!-- =====================================================
         GAME SCREEN
         ===================================================== -->

    <section
        id="gameScreen"
        class="screen"
    >

        <canvas id="gameCanvas"></canvas>

        <div class="game-ui">

            <div id="score">
                0
            </div>

        </div>

    </section>


    <!-- =====================================================
         GAME OVER SCREEN
         ===================================================== -->

    <section
        id="surpriseScreen"
        class="screen"
    >

        <div id="resultPanel">

            <img
                src="assets/surprise.png"
                alt="Surprise"
                id="surpriseImage"
            >

            <p class="game-over-label">
                GAME OVER
            </p>

            <h1 class="game-over-title">
                YOU GOT CAUGHT
            </h1>

            <p class="current-score-label">
                SCORE
            </p>

            <div id="resultScore">
                0
            </div>

            <button
                id="retryButton"
                class="game-button"
                type="button"
            >
                RETRY
            </button>

        </div>

    </section>


    <!-- =====================================================
         GAME JAVASCRIPT
         ===================================================== -->

    <script src="game.js"></script>

</body>

</html>
